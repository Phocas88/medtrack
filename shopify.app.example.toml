# Copy to shopify.app.toml and set client_id/application_url for your Partner app.
name = "Stokora"
application_url = "https://stokora.vercel.app"
embedded = false
[access_scopes]
scopes = "read_products,read_orders,read_inventory,write_inventory,read_locations,read_fulfillments,write_fulfillments"
[auth]
redirect_urls = ["https://stokora.vercel.app/api/shopify/callback"]
[webhooks]
api_version = "2026-10"
[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "orders/paid", "orders/cancelled"]
uri = "/api/shopify/webhook"
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/shopify/webhooks/app-uninstalled"
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/shopify/webhooks/gdpr"
